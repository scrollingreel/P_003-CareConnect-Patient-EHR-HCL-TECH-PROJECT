server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: hospital-rag-api
  main:
    allow-bean-definition-overriding: true
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.pgvector.autoconfigure.PgVectorStoreAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingConnectionAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiEmbeddingAutoConfiguration
      - org.springframework.ai.model.google.genai.autoconfigure.embedding.GoogleGenAiTextEmbeddingAutoConfiguration
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/apexcare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY:mock-key-for-local-dev}
        project-id: ${GOOGLE_PROJECT_ID:apexcare-hospital-rag}
        location: ${GOOGLE_LOCATION:us-central1}
        chat:
          model: ${GEMINI_CHAT_MODEL:gemini-2.5-flash}
          temperature: 0.0
          max-output-tokens: 700
        embedding:
          text:
            model: ${GEMINI_EMBEDDING_MODEL:text-embedding-004}

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:apexcare-hospital-rag-jwt-secret-key-must-be-at-least-32-chars!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  bootstrap-admin:
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@apexcare.org}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:SecurePass2026!}
    name: ${BOOTSTRAP_ADMIN_NAME:Amanda Ross}
  rag:
    top-k: ${RAG_TOP_K:4}
    similarity-threshold: ${RAG_SIMILARITY_THRESHOLD:0.10}
